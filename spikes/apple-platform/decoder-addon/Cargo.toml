[package]
name = "rx-decoder-addon-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Spike 5: prove attributed-body decoding as a decoder-only Node-API addon.
# Bytes in, text out. No filesystem, database, or Electron responsibility.

[lib]
crate-type = ["cdylib"]

[dependencies]
crabstep = { version = "0.5", features = ["foundation"] }
napi = { version = "2", default-features = false }
napi-derive = "2"

[build-dependencies]
napi-build = "2"

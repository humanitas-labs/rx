[package]
name = "rx-decoder-wasm-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Spike 5b: the decoder boundary as a WASM module with the production
# structured output shape. crabstep only — no sqlite, no filesystem.

[lib]
crate-type = ["cdylib"]

[dependencies]
crabstep = { version = "0.5", features = ["foundation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true

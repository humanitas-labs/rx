[package]
name = "rx-apple-body-decoder"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# The decoder boundary from ADR-003: attributedBody bytes in, structured JSON
# out, compiled to wasm32-unknown-unknown with no WASI and no privileged
# imports. crabstep only — no sqlite, no filesystem, no network.

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crabstep = { version = "0.5", features = ["foundation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
